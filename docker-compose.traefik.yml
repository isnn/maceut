# Optional: route the production web and API through the host's existing Traefik
# (docker provider, network `proxy`, resolver `myresolver`) instead of a hand-written
# nginx/Traefik file config. Hosts come from the root .env (WEB_HOST, API_HOST).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d --build
#
# Only web and api join `proxy`; worker, postgres and rabbitmq stay on the project's
# own network. Guide: docs/operations/deploy.md §2.

services:
  web:
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.maceut-web.rule: Host(`${WEB_HOST:?set WEB_HOST in .env}`)
      traefik.http.routers.maceut-web.entrypoints: websecure
      traefik.http.routers.maceut-web.tls: "true"
      traefik.http.routers.maceut-web.tls.certresolver: myresolver
      traefik.http.services.maceut-web.loadbalancer.server.port: "3000"

  api:
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.maceut-api.rule: Host(`${API_HOST:?set API_HOST in .env}`)
      traefik.http.routers.maceut-api.entrypoints: websecure
      traefik.http.routers.maceut-api.tls: "true"
      traefik.http.routers.maceut-api.tls.certresolver: myresolver
      traefik.http.services.maceut-api.loadbalancer.server.port: "8080"
      # Zone imports (GeoJSON / SHP) up to 20 MB.
      traefik.http.middlewares.maceut-api-body.buffering.maxRequestBodyBytes: "20971520"
      traefik.http.routers.maceut-api.middlewares: maceut-api-body

networks:
  proxy:
    external: true
