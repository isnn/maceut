services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Loopback only: Docker publishes past ufw, so "5432:5432" puts the database on the
    # internet. Reach it from this host (psql, Drizzle Studio) or over an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    # The queue declares durable queues and persistent messages, which is only true
    # for as long as the data directory survives. Without this, a container recreate
    # discards every queued capture and the code's promise is silently untrue.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Loopback only, same reason as postgres. The management UI (15672) can read, purge
    # and publish to every queue: open it through an SSH tunnel, never publicly.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # From the root .env; must match the user:password in api/.env RABBITMQ_URL. Like
    # postgres, these only take effect when the rabbitmq_data volume is first created.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run dev

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Not `tsx watch`: a watcher outlives a crashed worker and keeps the container "Up",
    # so the restart policy never fires (2026-10-08). After changing worker code, run
    # `docker compose restart worker`.
    command: npm run worker
    # A runaway export must not take the shared host down with it.
    mem_limit: 2g
    # The worker touches this file every 30 s while all its consumers have a channel.
    # Older than 2 minutes means it is running but not consuming. Status only: Compose
    # does not restart an unhealthy container, so a long export is never killed by it.
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 120 ]"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./web/.env.local
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev
    # `next dev` sits near 1.8 GB once every route has compiled.
    mem_limit: 3g

volumes:
  postgres_data:
  rabbitmq_data:
